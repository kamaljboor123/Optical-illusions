<script>
const pages={box:"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>خدعة الصندوقين<\/title>\n<style>\n:root{--bg:#fdf3ea;--fg:#2b2118;--card:#ffffff;--bd:#f08a3c;--btn:#f08a3c;--btnfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){color-scheme:dark;--bg:#1c1712;--fg:#f3e8dc;--card:#2a241d;--bd:#d9772a;--btn:#d9772a;--btnfg:#1c1712}}\n:root[data-theme=\"dark\"]{color-scheme:dark;--bg:#1c1712;--fg:#f3e8dc;--card:#2a241d;--bd:#d9772a;--btn:#d9772a;--btnfg:#1c1712}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,\"Segoe UI\",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;gap:14px}\nh1{font-size:1.3rem;margin:4px 0 0}\np{margin:0;opacity:.8;text-align:center;font-size:.95rem}\n.stage{width:100%;max-width:980px;background:var(--card);border:8px solid var(--bd);border-radius:12px;box-sizing:border-box}\nsvg{display:block;width:100%;height:auto;touch-action:none;user-select:none}\n.lid{cursor:grab;touch-action:none}.lid:active{cursor:grabbing}\n.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}\nbutton{background:var(--btn);color:var(--btnfg);border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}\n<\/style>\n<\/head>\n<body>\n<h1>خدعة الصندوقين<\/h1>\n<p>اسحب غطاء أي صندوق وضعه على الصندوق الآخر، وسيتطابق تماماً.<\/p>\n<div class=\"stage\"><svg id=\"s\" viewBox=\"60 70 680 270\" xmlns=\"http://www.w3.org/2000/svg\"><\/svg><\/div>\n<div class=\"row\"><button id=\"sw\">تبديل الغطاءين<\/button><button id=\"rs\">إعادة<\/button><\/div>\n<script>\nconst NS='http://www.w3.org/2000/svg',svg=document.getElementById('s');\nconst TH=54.3*Math.PI/180,H1=100,H2=65;\nconst SL={x:170,y:120},SR={x:580,y:110},slots=[SL,SR];\nconst L=[[0,0],[170,0],[120,60],[-50,60]];\nconst rot=(p,a)=>[p[0]*Math.cos(a)-p[1]*Math.sin(a),p[0]*Math.sin(a)+p[1]*Math.cos(a)];\nconst R=L.map(p=>rot(p,TH));\nfunction el(n,a,par){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(par||svg).appendChild(e);return e}\nfunction poly(pts,off,fill,stroke,par){return el('polygon',{points:pts.map(p=>(p[0]+off.x)+','+(p[1]+off.y)).join(' '),fill,stroke:stroke||'rgba(0,0,0,.35)','stroke-width':1.5,'stroke-linejoin':'round'},par)}\nconst dn=(p,h)=>[p[0],p[1]+h];\n// left box body\npoly([L[3],L[2],dn(L[2],H1),dn(L[3],H1)],SL,'#4f86cc');\npoly([L[1],L[2],dn(L[2],H1),dn(L[1],H1)],SL,'#3a68a3');\n// right box body\npoly([R[3],R[2],dn(R[2],H2),dn(R[3],H2)],SR,'#e07a5f');\npoly([R[2],R[1],dn(R[1],H2),dn(R[2],H2)],SR,'#bf5f47');\n// shipping icons\nfunction icons(x,y,a){const g=el('g',{transform:`translate(${x} ${y}) rotate(${a})`,fill:'none',stroke:'rgba(255,255,255,.85)','stroke-width':1.2});\n for(let i=0;i<3;i++){el('rect',{x:i*14,y:0,width:10,height:10,rx:1.5},g)}\n el('path',{d:'M5 2v6M3 4l2-2 2 2'},g);el('path',{d:'M19 2v6M17 8h4'},g);el('circle',{cx:33,cy:5,r:3},g)}\nicons(228,245,0);icons(620,262,4.4);\n// lids\nconst fills=['#8dbcf0','#f4a58a'],strokes=['#2f5890','#a84f3a'];\nconst P=(a,b)=>[170*a-50*b,60*b];\nconst tape=[P(0,.4),P(1,.4),P(1,.56),P(0,.56)];\nconst clamp=v=>Math.max(0,Math.min(1,v));\nconst ang=x=>TH*clamp((x-SL.x)/(SR.x-SL.x));\nconst lids=[0,1].map(i=>{\n const g=el('g',{class:'lid'});\n poly(L,{x:0,y:0},fills[i],strokes[i],g);\n poly(tape,{x:0,y:0},'rgba(255,248,225,.85)','rgba(0,0,0,.12)',g);\n const l={g,slot:i,x:slots[i].x,y:slots[i].y};draw(l);return l});\nfunction draw(l){l.g.setAttribute('transform',`translate(${l.x} ${l.y}) rotate(${ang(l.x)*180/Math.PI})`)}\nfunction anim(l,tx,ty,ms=280){const x0=l.x,y0=l.y,t0=performance.now();\n (function f(t){const k=clamp((t-t0)/ms),e=1-Math.pow(1-k,3);l.x=x0+(tx-x0)*e;l.y=y0+(ty-y0)*e;draw(l);if(k<1)requestAnimationFrame(f)})(t0)}\nfunction place(l,k){l.slot=k;anim(l,slots[k].x,slots[k].y)}\nfunction moveTo(l,k){const o=lids.find(m=>m!==l&&m.slot===k);if(k===l.slot){place(l,k);return}\n const old=l.slot;place(l,k);if(o)place(o,old)}\nfunction pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}\nlids.forEach(l=>{let off=null;\n l.g.addEventListener('pointerdown',e=>{e.preventDefault();l.g.setPointerCapture(e.pointerId);svg.appendChild(l.g);const p=pt(e);off={x:p.x-l.x,y:p.y-l.y}});\n l.g.addEventListener('pointermove',e=>{if(!off)return;const p=pt(e);l.x=p.x-off.x;l.y=p.y-off.y;draw(l)});\n const up=()=>{if(!off)return;off=null;const d=slots.map(s=>Math.hypot(s.x-l.x,s.y-l.y));moveTo(l,d[0]<=d[1]?0:1)};\n l.g.addEventListener('pointerup',up);l.g.addEventListener('pointercancel',up)});\ndocument.getElementById('sw').onclick=()=>{const a=lids[0],b=lids[1],sa=a.slot;place(a,b.slot);place(b,sa)};\ndocument.getElementById('rs').onclick=()=>{place(lids[0],0);place(lids[1],1)};\n<\/script>\n<\/body>\n<\/html>\n",bat:"<!doctype html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>خدعة المنظور: البطاريتان<\/title>\n<style>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);\n--bg:#e9ecef;--fg:#16191c;--mut:#5a6169;--btn:#16191c;--btnfg:#fff;--line:#c5cbd1}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#101214;--fg:#eceff2;--mut:#98a1ab;--btn:#eceff2;--btnfg:#101214;--line:#2c3137}}\n:root[data-theme=\"dark\"]{--bg:#101214;--fg:#eceff2;--mut:#98a1ab;--btn:#eceff2;--btnfg:#101214;--line:#2c3137}\n*{box-sizing:border-box}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--fg);font-family:\"Segoe UI\",Tahoma,\"Noto Sans Arabic\",system-ui,sans-serif;line-height:1.7}\nmain{max-width:1240px;margin:0 auto;padding:20px 14px 28px}\nh1{font-size:clamp(22px,4vw,32px);margin:0 0 4px;font-weight:800}\np{margin:0 0 14px;color:var(--mut);max-width:62ch}\n.paper{direction:ltr;border:1px solid var(--line);border-radius:6px;overflow-x:auto;background:#eef0f1}\ncanvas{display:block;width:100%;height:auto;aspect-ratio:930/600;touch-action:none;cursor:grab}\ncanvas.drag{cursor:grabbing}\n.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}\nbutton{font:inherit;font-weight:600;padding:8px 16px;border-radius:4px;border:1.5px solid var(--btn);background:transparent;color:var(--fg);cursor:pointer}\nbutton:hover{background:var(--btn);color:var(--btnfg)}\nbutton[aria-pressed=\"true\"]{background:var(--btn);color:var(--btnfg)}\nbutton:focus-visible{outline:3px solid #2f7bff;outline-offset:2px}\n.reveal-note{display:none;margin-top:10px;font-size:14px;font-weight:600;color:#e0301e}\n.reveal-note.on{display:block}\n.tilt-wrap{display:none;align-items:center;gap:8px;margin-top:10px;width:100%;max-width:420px}\n.tilt-wrap.on{display:flex}\n.tilt-wrap label{font-size:14px;color:var(--mut);white-space:nowrap}\n.tilt-wrap input[type=range]{flex:1;accent-color:var(--fg)}\n<\/style>\n<\/head>\n<body>\n<main>\n<h1>خدعة المنظور: البطاريتان بنفس الحجم<\/h1>\n<p>الشبكة مرسومة على سطح مسطح، لكن عقلك يقرؤها كممر يبتعد. اسحب أي بطارية لتدحرجها، وستلاحظ أن اليمنى تبدو أكبر رغم أن الحجمين متطابقان.<\/p>\n<div class=\"paper\"><canvas id=\"c\" role=\"img\" aria-label=\"شبكة منظورية عليها بطاريتان قابلتان للسحب والتدحرج\"><\/canvas><\/div>\n<div class=\"bar\">\n<button id=\"roll\">دحرجة<\/button>\n<button id=\"cmp\" aria-pressed=\"false\">ضعهما جنباً إلى جنب<\/button>\n<button id=\"gd\" aria-pressed=\"false\">خطوط القياس<\/button>\n<button id=\"rv\" aria-pressed=\"false\">كشف الحجم الحقيقي<\/button>\n<button id=\"fp\" aria-pressed=\"false\">أزل المنظور<\/button>\n<button id=\"tl\" aria-pressed=\"false\">تحكم بإمالة الهاتف<\/button>\n<button id=\"rs\">إعادة<\/button>\n<\/div>\n<div class=\"reveal-note\" id=\"rnote\">كلا البطاريتين بنفس الأبعاد بالبكسل تماماً — قارن بين الإطارين.<\/div>\n<div class=\"tilt-wrap\" id=\"tiltWrap\">\n  <label for=\"tiltRange\">إمالة يدوية<\/label>\n  <input type=\"range\" id=\"tiltRange\" min=\"-45\" max=\"45\" value=\"0\" step=\"1\">\n<\/div>\n<\/main>\n<script>\n/* ============ إعدادات عامة ============ */\nconst W=930,H=600,R=22,BH=144,cy=300;\nconst cv=document.getElementById('c'),ctx=cv.getContext('2d');\nconst dpr=Math.min(window.devicePixelRatio||1,2);\ncv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);\n\n/* ============ نسيج الأسطوانة (UV = الزاوية) ============ */\nconst TW=720,TH=BH*2,tex=document.createElement('canvas');tex.width=TW;tex.height=TH;\n(function(){\n const t=tex.getContext('2d');\n const g=t.createLinearGradient(0,0,0,TH);\n g.addColorStop(0,'#f0c23c');g.addColorStop(.35,'#dba01c');g.addColorStop(.72,'#c9741a');g.addColorStop(1,'#a53f17');\n t.fillStyle=g;t.fillRect(0,0,TW,TH);\n t.fillStyle='#1c130a';t.fillRect(0,0,TW*.2,TH);\n t.save();t.translate(TW*.1,TH/2);t.rotate(-Math.PI/2);t.fillStyle='#f3c844';t.direction='rtl';t.textAlign='center';\n let fs=40;const fam='\"Segoe UI\",Tahoma,\"Noto Sans Arabic\",Arial,sans-serif';\n t.font='bold '+fs+'px '+fam;const tw=t.measureText('فكرة وتطبيق ذكي').width;\n if(tw>TH-36){fs=Math.floor(fs*(TH-36)/tw);t.font='bold '+fs+'px '+fam}\n t.fillText('فكرة وتطبيق ذكي',0,fs*.34);t.restore();\n t.fillStyle='rgba(60,25,5,.55)';t.fillRect(TW*.5,0,5,TH);t.fillRect(TW*.76,0,3,TH);\n t.save();t.translate(TW*.62,TH/2);t.rotate(-Math.PI/2);t.fillStyle='rgba(70,28,5,.8)';t.font='bold 22px Arial,sans-serif';t.textAlign='center';t.fillText('ALKALINE',0,8);t.restore();\n t.fillStyle='rgba(70,28,5,.85)';t.font='bold 34px Arial';t.textAlign='center';t.fillText('+',TW*.88,40);\n})();\n\n/* ============ الحالة ============ */\nconst home=()=>[\n {id:0,x:150,y:cy,rot:0,vx:0,tw:null},\n {id:1,x:590,y:cy,rot:2.2,vx:0,tw:null}\n];\nlet bats=home();\nlet guides=false, compare=false, drag=null;\nlet revealMode=false, flatMode=false;\n\n/* ============ الشبكة ============ */\nfunction grid(){\n ctx.fillStyle='#eef0f1';ctx.fillRect(0,0,W,H);\n ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.lineJoin='miter';\n\n if(flatMode){\n   // شبكة مسطّحة: تباعد موحّد، بلا تقارب — ينهار الإيهام فوراً\n   const s=48;\n   ctx.beginPath();\n   for(let x=24;x<=W;x+=s){ctx.moveTo(x,0);ctx.lineTo(x,H)}\n   for(let y=24;y<=H;y+=s){ctx.moveTo(0,y);ctx.lineTo(W,y)}\n   ctx.stroke();\n   return;\n }\n\n // الشبكة المنظورية الأصلية\n const x0=126,vx=-90,k=72/(x0-vx),d0=x0-vx,ratio=2.8,xe=vx+d0*ratio,he=72*ratio,cw=he*2/3;\n const Q=[-1,-1/3,1/3,1];\n ctx.beginPath();\n for(let i=0;i<=2;i++){const x=30+i*48;ctx.moveTo(x,228);ctx.lineTo(x,372)}\n for(let j=0;j<=3;j++){const y=228+j*48;ctx.moveTo(30,y);ctx.lineTo(126,y)}\n for(let i=0;i<=6;i++){const x=vx+d0*Math.pow(ratio,i/6),h=k*(x-vx);ctx.moveTo(x,cy-h);ctx.lineTo(x,cy+h)}\n Q.forEach(q=>{ctx.moveTo(x0,cy+q*72);ctx.lineTo(xe,cy+q*he);ctx.lineTo(W,cy+q*he)});\n for(let x=xe+cw;x<W;x+=cw){ctx.moveTo(x,cy-he);ctx.lineTo(x,cy+he)}\n ctx.stroke();\n}\n\n/* ============ رسم البطارية ============ */\nfunction bat(b){\n const {x,y,rot}=b,top=y-BH/2;\n\n // (1) ظل ناعم حقيقي: تدرّج شعاعي بدل مستطيل صلب\n ctx.save();\n const sg=ctx.createRadialGradient(x+14,y+8,4,x+14,y+8,R+28);\n sg.addColorStop(0,'rgba(0,0,0,.38)');\n sg.addColorStop(.5,'rgba(0,0,0,.14)');\n sg.addColorStop(1,'rgba(0,0,0,0)');\n ctx.fillStyle=sg;\n ctx.beginPath();\n ctx.ellipse(x+10,y+6,R+24,BH/2+10,0,0,Math.PI*2);\n ctx.fill();\n ctx.restore();\n\n // (2) جسم الأسطوانة + إضاءة ناعمة\n for(let i=0;i<2*R;i++){\n  const s=(i+.5-R)/R;\n  const c=Math.sqrt(Math.max(0,1-s*s));\n  const th=Math.asin(s)+rot;\n  const sw=Math.min(14,Math.max(1,TW/(2*Math.PI*R*Math.max(c,.08))));\n  let u=(((th/(2*Math.PI))%1)+1)%1*TW-sw/2;\n  u=Math.max(0,Math.min(TW-sw,u));\n  const px=x-R+i;\n  ctx.drawImage(tex,u,0,sw,TH,px,top,1.05,BH);\n\n  // إضاءة لامبرت ناعمة بدل تركيب خطي\n  const l=.7*c-.45*s;\n  const br=Math.max(.22,Math.min(1,.3+.9*l));\n  ctx.fillStyle='rgba(0,0,0,'+(1-br).toFixed(3)+')';\n  ctx.fillRect(px,top,1.05,BH);\n\n  // بريق متمركز\n  const sp=Math.max(0,1-Math.abs(s+.38)/.16)*.42;\n  if(sp>0){\n   ctx.fillStyle='rgba(255,255,255,'+sp.toFixed(3)+')';\n   ctx.fillRect(px,top,1.05,BH);\n  }\n }\n\n // (3) خطّا الحدّ العلوي والسفلي\n ctx.fillStyle='rgba(0,0,0,.45)';\n ctx.fillRect(x-R,top,2*R,2);\n ctx.fillRect(x-R,top+BH-2,2*R,2);\n\n // (4) غطاء بيضاوي (قطب موجب) بدل مستطيل\n const g=ctx.createLinearGradient(x-10,0,x+10,0);\n g.addColorStop(0,'#666');g.addColorStop(.35,'#f2f2f2');\n g.addColorStop(.7,'#b0b0b0');g.addColorStop(1,'#4a4a4a');\n ctx.fillStyle=g;\n ctx.beginPath();\n ctx.ellipse(x,top-4,9,4.5,0,0,Math.PI*2);\n ctx.fill();\n ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=1;ctx.stroke();\n // بريق علوي على الغطاء\n ctx.beginPath();\n ctx.ellipse(x-2,top-5,4,1.8,0,0,Math.PI*2);\n ctx.fillStyle='rgba(255,255,255,.35)';ctx.fill();\n}\n\n/* ============ خطوط القياس ============ */\nfunction guideLines(){\n if(!guides)return;\n const a=bats[0];\n ctx.save();\n ctx.strokeStyle='#e0301e';ctx.lineWidth=1.5;ctx.setLineDash([8,6]);\n [a.y-BH/2-9,a.y+BH/2].forEach(y=>{\n  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();\n });\n ctx.restore();\n}\n\n/* ============ إطار كشف الحجم الحقيقي ============ */\nfunction drawReveal(){\n if(!revealMode)return;\n bats.forEach((b,i)=>{\n  const top=b.y-BH/2, h=BH;\n  const col=i===0?'#e0301e':'#0b7a2a';\n  ctx.save();\n  ctx.strokeStyle=col;ctx.lineWidth=2;\n  ctx.setLineDash([6,4]);\n  ctx.strokeRect(b.x-R,top,2*R,h);\n\n  // زوايا صغيرة للتأكيد البصري\n  ctx.setLineDash([]);\n  const cs=7;\n  [[b.x-R,top, 1, 1],[b.x+R,top,-1, 1],\n   [b.x-R,top+h, 1,-1],[b.x+R,top+h,-1,-1]]\n   .forEach(([cx,cy2,dx,dy])=>{\n    ctx.beginPath();\n    ctx.moveTo(cx,cy2);ctx. i=bats.length-1;i>=0;i--){\n  const b=bats[i];\n  if(Math.abs(p.x-b.x)<R+14 && Math.abs(p.y-b.y)<BH/2+9){\n   b.tw=null;b.vx=0;\n   drag={b,px:p.x,py:p.y,v:0};\n   bats.splice(i,1);bats.push(b);\n   cv.setPointerCapture(e.pointerId);\n   cv.classList.add('drag');\n   wake();\n   return;\n  }\n }\n});\n\ncv.addEventListener('pointermove',e=>{\n if(!drag)return;\n const p=pos(e),b=drag.b,dx=p.x-drag.px,dy=p.y-drag.py;\n b.x=Math.max(R+4,Math.min(W-R-4,b.x+dx));\n b.y=Math.max(BH/2+14,Math.min(H-BH/2-6,b.y+dy));\n b.rot+=dx/R;\n drag.v=drag.v*.6+dx*.4;\n drag.px=p.x;drag.py=p.y;\n // المرساة تُسحب + المقارنة مفعّلة: حدّث هدف التابعة فوراً\n if(compare&&b.id===0){\n  const o=bats.find(x=>x!==b);\n  if(o)o.tw={x:b.x+54,y:b.y};\n }\n wake();\n});\n\nconst endDrag=()=>{\n if(drag){\n  drag.b.vx=Math.abs(drag.v)>.5?drag.v:0;\n  drag=null;\n  cv.classList.remove('drag');\n  wake();\n }\n};\ncv.addEventListener('pointerup',endDrag);\ncv.addEventListener('pointercancel',endDrag);\n\n/* ============ الأزرار ============ */\ndocument.getElementById('roll').onclick=()=>{\n bats.forEach((b,i)=>{b.tw=null;b.vx=(i%2?-1:1)*8});\n wake();\n};\n\nconst cmp=document.getElementById('cmp');\ncmp.onclick=()=>{\n compare=!compare;\n cmp.setAttribute('aria-pressed',compare);\n const a=bats.find(b=>b.id===0)||bats[0];\n const o=bats.find(b=>b!==a);\n if(compare){\n  if(o){o.vx=0;o.tw={x:a.x+54,y:a.y}}\n } else {\n  if(o)o.tw={x:590,y:cy};\n }\n wake();\n};\n\nconst gd=document.getElementById('gd');\ngd.onclick=()=>{\n guides=!guides;\n gd.setAttribute('aria-pressed',guides);\n wake();\n};\n\nconst rv=document.getElementById('rv'),rnote=document.getElementById('rnote');\nrv.onclick=()=>{\n revealMode=!revealMode;\n rv.setAttribute('aria-pressed',revealMode);\n rnote.classList.toggle('on',revealMode);\n wake();\n};\n\nconst fp=document.getElementById('fp');\nfp.onclick=()=>{\n flatMode=!flatMode;\n fp.setAttribute('aria-pressed',flatMode);\n wake();\n};\n\n/* ============ الإمالة (النسخة المُصل seInt(rng.value,10)/45);\n wake();\n});\n\n/* ============ إعادة ضبط شاملة (إصلاح #4) ============ */\ndocument.getElementById('rs').onclick=()=>{\n bats=home();\n compare=false;cmp.setAttribute('aria-pressed',false);\n guides=false;gd.setAttribute('aria-pressed',false);\n revealMode=false;rv.setAttribute('aria-pressed',false);rnote.classList.remove('on');\n flatMode=false;fp.setAttribute('aria-pressed',false);\n stopTilt();\n wrap.classList.remove('on');\n rng.value=0;\n wake();\n};\n\n/* تشغيل أولي */\nwake();\n<\/script>\n<\/body>\n<\/html>\n"};
